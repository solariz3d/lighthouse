<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 820" width="980" height="820" font-family="Helvetica, Arial, sans-serif">
  <!-- D659 the kid: proportion and layer sheet (pane E). Heights from dreamzone-3 game/body.h BodyBuild; 1 m = 400 px; ground at y=720. -->
  <rect width="980" height="820" fill="#f4f2ee"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">The kid, 2004-05: proportions (BodyBuild) and layers</text>
  <text x="20" y="50" font-size="12" fill="#555">Front view, standing. Heights in metres from the floor. The eye is the camera (head joint locked to it).</text>

  <g transform="translate(0,50)">
  <!-- height scale -->
  <g stroke="#bbb" stroke-width="1" font-size="11" fill="#666">
    <line x1="60" y1="720" x2="60" y2="0"/>
    <line x1="55" y1="720" x2="65" y2="720"/><text x="20" y="724" stroke="none">0.00</text>
    <line x1="55" y1="520" x2="65" y2="520"/><text x="20" y="524" stroke="none">0.50</text>
    <line x1="55" y1="320" x2="65" y2="320"/><text x="20" y="324" stroke="none">1.00</text>
    <line x1="55" y1="120" x2="65" y2="120"/><text x="20" y="124" stroke="none">1.50</text>
  </g>

  <!-- joint guide lines -->
  <g stroke="#d33" stroke-dasharray="4 4" stroke-width="1" font-size="11" fill="#b22">
    <line x1="70" y1="60" x2="470" y2="60"/><text x="475" y="64" stroke="none">eye 1.65 (camera)</text>
    <line x1="70" y1="112" x2="470" y2="112"/><text x="475" y="116" stroke="none">neck 1.52 (0.09 behind eye)</text>
    <line x1="70" y1="160" x2="470" y2="160"/><text x="475" y="164" stroke="none">shoulders 1.40, half-width 0.19</text>
    <line x1="70" y1="352" x2="470" y2="352"/><text x="475" y="356" stroke="none">pelvis 0.92, hip half-width 0.10</text>
    <line x1="70" y1="536" x2="470" y2="536"/><text x="475" y="540" stroke="none">knee ~0.46-0.52</text>
    <line x1="70" y1="692" x2="470" y2="692"/><text x="475" y="696" stroke="none">ankle 0.07</text>
  </g>
  <text x="475" y="24" font-size="11" fill="#b22">top of head ~1.80 (eye + 0.15)</text>

  <!-- figure, front: masses coloured by outermost layer -->
  <g transform="translate(270,0)">
    <!-- legs: jeans -->
    <path d="M-40,352 L-46,700 L-18,700 L-6,420 L6,420 L18,700 L46,700 L40,352 Z" fill="#2f3e5c"/>
    <path d="M-44,520 L-20,520 L-20,560 L-45,560 Z" fill="#50607e" opacity="0.8"/>
    <!-- shoes -->
    <path d="M-50,700 L-12,700 L-10,720 L-56,720 Z" fill="#6b6b68"/>
    <path d="M12,700 L50,700 L56,720 L10,720 Z" fill="#6b6b68"/>
    <rect x="-56" y="716" width="46" height="4" fill="#1e1e1e"/><rect x="10" y="716" width="46" height="4" fill="#1e1e1e"/>
    <!-- hoodie torso, too big at the shoulders -->
    <path d="M-62,156 Q0,140 62,156 L66,372 Q0,384 -66,372 Z" fill="#3a3d42"/>
    <!-- tee hem showing below hoodie -->
    <path d="M-60,372 Q0,384 60,372 L58,386 Q0,396 -58,386 Z" fill="#9a9a98"/>
    <!-- open zip line and tee showing -->
    <path d="M-10,150 L10,150 L8,372 L-8,372 Z" fill="#9a9a98"/>
    <line x1="-9" y1="150" x2="-8" y2="372" stroke="#1e1e1e" stroke-width="1.5"/>
    <line x1="9" y1="150" x2="8" y2="372" stroke="#1e1e1e" stroke-width="1.5"/>
    <!-- hood bunched at back of neck -->
    <path d="M-34,122 Q0,104 34,122 L30,150 Q0,140 -30,150 Z" fill="#33363b"/>
    <!-- arms: sleeves to the knuckles -->
    <path d="M-62,160 L-82,272 L-88,384 L-66,388 L-62,276 L-48,180 Z" fill="#3a3d42"/>
    <path d="M62,160 L82,272 L88,384 L66,388 L62,276 L48,180 Z" fill="#3a3d42"/>
    <!-- hands: fingertips at ~0.66 -->
    <path d="M-88,384 L-66,388 L-70,454 L-90,448 Z" fill="#c9a07e"/>
    <path d="M88,384 L66,388 L70,454 L90,448 Z" fill="#c9a07e"/>
    <!-- pale band on left wrist (his left = viewer right) -->
    <rect x="68" y="388" width="20" height="5" fill="#e2c7ad"/>
    <!-- neck and head -->
    <rect x="-12" y="104" width="24" height="24" fill="#c9a07e"/>
    <ellipse cx="0" cy="70" rx="30" ry="40" fill="#c9a07e"/>
    <!-- ears that stand out a little -->
    <ellipse cx="-31" cy="70" rx="6" ry="10" fill="#c09474"/><ellipse cx="31" cy="70" rx="6" ry="10" fill="#c09474"/>
    <!-- hair: grown out, over ears and eyes -->
    <path d="M-34,64 Q-38,22 0,24 Q40,22 34,64 L30,52 Q14,58 -4,64 Q-20,58 -30,74 Z" fill="#3b2a20"/>
    <!-- eyes line -->
    <ellipse cx="-11" cy="62" rx="5" ry="2.5" fill="#5a3d28"/><ellipse cx="11" cy="62" rx="5" ry="2.5" fill="#5a3d28"/>
    <!-- key on a shoelace -->
    <path d="M-10,128 Q0,200 10,128" fill="none" stroke="#2a3550" stroke-width="2"/>
    <rect x="-3" y="196" width="6" height="12" fill="#b8a46a"/>
  </g>

  <!-- side view: posture -->
  <g transform="translate(580,0)">
        <path d="M0,720 L6,540 L2,352 L-4,240 L4,150 L14,112" fill="none" stroke="#3a3d42" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="20" cy="70" r="34" fill="#c9a07e"/>
    <path d="M-14,58 Q10,28 48,52 L44,40 Q12,10 -14,40 Z" fill="#3b2a20"/>
  </g>

  </g>
  <text x="400" y="808" font-size="12" fill="#333">Side (right): head forward ~4 cm, shoulders rounded, hands in the hoodie pocket at rest.</text>
  <!-- swatches -->
  <g font-size="11" fill="#222" transform="translate(70,-330)">
    <text x="600" y="420" font-size="13" font-weight="bold">Layers and CC0 materials (Poly Haven ids)</text>
    <rect x="600" y="432" width="22" height="16" fill="#3a3d42"/><text x="630" y="444">L2 hoodie, charcoal: jogging_melange</text>
    <rect x="600" y="456" width="22" height="16" fill="#9a9a98"/><text x="630" y="468">L1 tee, heather grey: jersey_melange</text>
    <rect x="600" y="480" width="22" height="16" fill="#2f3e5c"/><text x="630" y="492">L1 jeans, dark indigo: denim_fabric_0x</text>
    <rect x="600" y="504" width="22" height="16" fill="#6b6b68"/><text x="630" y="516">shoes, grey suede: scuba_suede</text>
    <rect x="600" y="528" width="22" height="16" fill="#2a3550"/><text x="630" y="540">key cord, navy shoelace; brass key</text>
    <rect x="600" y="552" width="22" height="16" fill="#3b2a20"/><text x="630" y="564">hair, dark brown, opaque mesh clumps</text>
    <rect x="600" y="576" width="22" height="16" fill="#c9a07e"/><text x="630" y="588">skin, light olive (MPFB skin, tuned)</text>
    <rect x="600" y="600" width="22" height="16" fill="#e2c7ad"/><text x="630" y="612">pale band, left wrist: where a watch was</text>
  </g>
  <text x="20" y="790" font-size="10" fill="#777">Invented character; not based on any real person or existing character. Swatch hex values are targets for the albedo tint, not the textures' own colours.</text>
</svg>
